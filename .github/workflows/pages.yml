name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 두 번 배포하지 않는다. 다만 진행 중인 것을 죽이지도 않는다 —
# 반쯤 올라간 상태로 남는 것이 가장 나쁘다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # 스타일을 브라우저 없이 검증한다. 화면이 비었을 때 '코드가 틀렸는가' 와
      # '화면이 안 그려지는가' 를 구분해 주는 유일한 장치다.
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/configure-pages@v5
      # 모듈 주소에 버전 도장을 찍는다. GitHub Pages 가 max-age=600 을 보내므로
      # 도장이 없으면 고쳐 올려도 10분 동안 옛 코드가 돈다 — 실제로 겪었다.
      - run: python3 scripts/stamp_version.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
